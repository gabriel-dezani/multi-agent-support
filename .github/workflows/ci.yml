name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require integration dependencies (no silent skipped tests)
        run: python -c "import langgraph, langchain_core, langchain_openai, chromadb, structlog"
      - name: Compile
        run: python -m compileall -q app scripts tests
      - name: Test with coverage (skipped modules are a CI failure)
        run: |
          python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90 -rA > pytest-results.txt
          cat pytest-results.txt
          if grep -Eq '([1-9][0-9]* skipped|SKIPPED)' pytest-results.txt; then
            echo 'Unexpected skipped tests' >&2; exit 1
          fi
      - name: Feedback V6 regression quality gate
        run: python -m scripts.evaluate_feedback_v6
      - name: Offline factuality and routing scorecard (no paid API)
        run: python -m scripts.offline_quality_scorecard --output offline_quality_scorecard.json
      - name: Upload offline quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-quality-scorecard
          path: offline_quality_scorecard.json
          if-no-files-found: ignore
      - name: Offline supervisor decision gates (22 policy cases, no API)
        run: python -m scripts.offline_supervisor_scorecard --output supervisor_scorecard.json
      - name: Upload supervisor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-scorecard
          path: supervisor_scorecard.json
          if-no-files-found: ignore
      - name: Routing evaluation (10 challenge examples)
        run: |
          python -m scripts.evaluate --mode router --output routing_ci.json
          python -c "import json; assert json.load(open('routing_ci.json'))['route_accuracy'] == 1.0"
      - name: Long-turn session and supervisor regression (offline)
        run: python -m scripts.offline_long_turn_scorecard --output long_turn_scorecard.json
      - name: Upload long-turn regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-turn-regression
          path: long_turn_scorecard.json
          if-no-files-found: ignore
      - name: Multi-turn evaluation
        run: |
          python -m scripts.evaluate_multiturn --mode router --output multiturn_ci.json
          python -c "import json; assert json.load(open('multiturn_ci.json'))['turn_accuracy'] == 1.0"
      - name: HTTP security, handoff and memory smoke
        run: python -m scripts.offline_api_smoke
      - name: External search privacy boundary
        run: python -m scripts.offline_web_privacy_smoke
      - name: Graph node regression smoke
        run: python -m scripts.offline_graph_smoke
      - name: Grounded RAG contract smoke
        run: python -m scripts.offline_rag_smoke
      - name: Parallel HTTP ticket stress
        run: python -m scripts.offline_api_stress
      - name: Independent hybrid retrieval and 250/500/1000-turn memory benchmark
        run: python -m scripts.offline_final_pillars
      - name: Upload final pillar benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-pillar-benchmark
          path: docs/final_pillars_benchmark.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose overlays (no external API)
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.hardened.yml config --quiet
          rm -f .env
      - name: Build image
        run: docker build -t multi-agent-support:ci .
      - name: Verify writable non-root Docker volumes
        run: |
          docker run --rm -v v6_ci_state:/app/.state -v v6_ci_vectors:/app/.vector_data \
            --entrypoint python multi-agent-support:ci -c \
            "from pathlib import Path; Path('/app/.state/probe').write_text('ok'); Path('/app/.vector_data/probe').write_text('ok')"
          docker volume rm v6_ci_state v6_ci_vectors
      - name: Boot container and check health endpoint
        run: |
          docker run -d --name v6_ci_health multi-agent-support:ci
          for attempt in $(seq 1 20); do
            if docker exec v6_ci_health python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200"; then
              docker rm -f v6_ci_health
              exit 0
            fi
            sleep 2
          done
          docker logs v6_ci_health
          docker rm -f v6_ci_health
          exit 1

  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: multi_agent_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d multi_agent_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgresql://ci:ci_test_only@127.0.0.1:5432/multi_agent_ci
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install central persistence dependencies (no model APIs)
        run: python -m pip install -r requirements-postgres.txt
      - name: Real PostgreSQL state, isolation, atomic handoff and advisory-lock smoke
        run: |
          python -m coverage run --rcfile=.coveragerc.postgres -m scripts.postgres_state_smoke
          python -m coverage combine --rcfile=.coveragerc.postgres
          python -m coverage report --rcfile=.coveragerc.postgres -m
          python -m coverage json --rcfile=.coveragerc.postgres -o postgres-coverage.json
          python -c "import json; r=json.load(open('postgres-coverage.json')); assert any(p.endswith('postgres_state.py') for p in r['files']); assert any(p.endswith('distributed_lock.py') for p in r['files']); assert all(v['summary']['covered_lines'] > 0 for v in r['files'].values())"
      - name: Upload separate PostgreSQL coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-contract-coverage
          path: postgres-coverage.json
          if-no-files-found: error
