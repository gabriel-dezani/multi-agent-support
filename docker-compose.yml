services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["vector_data:/app/.vector_data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  vector_data:
