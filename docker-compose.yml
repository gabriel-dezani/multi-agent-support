services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: [.env]
    volumes:
      - vector_data:/app/.vector_data
      - state_data:/app/.state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  vector_data:
  state_data:
